<body>

    <!-- desteklenen formatlar mp4,webm,ogg -->

    <video width="320" height="240" controls autoplay muted>
        <source src="movie.mp4" type="video/mp4">

    </audio>

    <!-- youtube sağ tık yerleştirme kodunu kopyala -->

    <iframe width="424" height="238" src="https://www.youtube.com/embed/9_R9sQHrzLY"
        title="Happy &amp; You Know It 🌊 | NEW ⭐ JJ&#39;s Animal Time | CoComelon Nursery Rhymes &amp; Kids Songs"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</html>
